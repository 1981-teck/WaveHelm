name: Bug report
description: Report a reproducible problem in WaveHelm
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a WaveHelm bug.

        Please provide enough information to reproduce the problem. Remove private file paths, media names, credentials, or other sensitive information before posting logs or screenshots.

  - type: input
    id: version
    attributes:
      label: WaveHelm version or commit
      description: Example: v1.0.1 or a Git commit hash.
      placeholder: v1.0.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Example: Windows 11 24H2.
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: If running from source, provide the Python version.
      placeholder: Python 3.12.x
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open WaveHelm
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste relevant logs or traceback here. Remove sensitive information first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, frequency of occurrence, regression information, or anything else useful.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing Issues and Discussions for the same problem.
          required: true
        - label: I removed private or sensitive information from logs and screenshots.
          required: true
