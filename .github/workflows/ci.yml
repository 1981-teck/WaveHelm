name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject generated or sensitive tracked files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
              encoding="utf-8",
          ).splitlines()
          forbidden_parts = {
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "build",
              "dist",
          }
          forbidden_suffixes = {".pyc", ".pyo", ".db", ".sqlite", ".sqlite3", ".log"}
          violations = []
          for raw_path in tracked:
              path = Path(raw_path)
              if any(part in forbidden_parts for part in path.parts):
                  violations.append(raw_path)
                  continue
              if path.suffix.lower() in forbidden_suffixes:
                  violations.append(raw_path)
                  continue
              if len(path.parts) >= 2 and path.parts[0] == "tests" and path.parts[1].startswith("_"):
                  violations.append(raw_path)
          if violations:
              message = "Forbidden tracked release files:\n" + "\n".join(sorted(violations))
              raise SystemExit(message)

          required_licenses = {
              "Apache-2.0.txt",
              "BSD-3-Clause.txt",
              "LGPL-2.1.txt",
              "MIT.txt",
              "MIT-CMU.txt",
              "PSF-2.0.txt",
              "wxWindows-Library-Licence-3.1.txt",
          }
          licenses_root = Path("src/resources/legal/licenses")
          present = {path.name for path in licenses_root.glob("*.txt")}
          missing = sorted(required_licenses - present)
          if missing:
              raise SystemExit("Missing required license texts: " + ", ".join(missing))
          PY

  test-and-build:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run complete source test suite
        run: python -m pytest -q tests

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload build artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: wavehelm-python-distributions
          path: dist/*
          if-no-files-found: error

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install release audit tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.1

      - name: Create isolated Windows runtime environment
        shell: pwsh
        run: |
          python -m venv --without-pip .wavehelm-runtime-audit
          python -m pip --python .wavehelm-runtime-audit install -r requirements.txt
          python -m pip --python .wavehelm-runtime-audit check
          python -m pip --python .wavehelm-runtime-audit freeze --all | Out-File -Encoding utf8 runtime-freeze.txt

      - name: Audit installed runtime dependency graph
        id: dependency-audit
        continue-on-error: true
        shell: pwsh
        run: |
          $sitePackages = Join-Path $PWD '.wavehelm-runtime-audit\Lib\site-packages'
          python -m pip_audit --path $sitePackages --format json --output pip-audit.json

      - name: Generate reproducible transitive CycloneDX SBOM
        shell: pwsh
        run: |
          cyclonedx-py environment .wavehelm-runtime-audit `
            --output-reproducible `
            --pyproject pyproject.toml `
            --mc-type application `
            --sv 1.6 `
            --of JSON `
            -o sbom.cdx.json

      - name: Verify SBOM contains runtime transitive dependencies
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          bom = json.loads(Path("sbom.cdx.json").read_text(encoding="utf-8"))
          names = {str(component.get("name", "")).lower() for component in bom.get("components", [])}
          required = {"pillow", "pywin32", "comtypes", "cffi", "contourpy", "fonttools", "python-dateutil"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit("SBOM missing expected Windows runtime/transitive components: " + ", ".join(missing))
          '@ | python -

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wavehelm-supply-chain-evidence
          path: |
            pip-audit.json
            runtime-freeze.txt
            sbom.cdx.json
          if-no-files-found: warn

      - name: Enforce dependency audit result
        if: steps.dependency-audit.outcome != 'success'
        run: exit 1
