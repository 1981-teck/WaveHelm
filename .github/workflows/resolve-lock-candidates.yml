name: Resolve WaveHelm Windows lock candidates

on:
  push:
    branches:
      - fix/wavehelm-dependency-security-2026-11
    paths:
      - .github/workflows/resolve-lock-candidates.yml

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and install / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            target: "311"
          - python-version: "3.12"
            target: "312"
          - python-version: "3.13"
            target: "313"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve, verify and install both candidate locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --isolated --disable-pip-version-check --no-input --only-binary=:all: pip==26.2.1 packaging==25.0
          if ($LASTEXITCODE -ne 0) { throw 'resolver bootstrap failed' }
          $out = Join-Path $env:RUNNER_TEMP 'wavehelm-lock-candidates'
          New-Item -ItemType Directory -Path $out | Out-Null
          $runtime = Join-Path $out 'windows-py${{ matrix.target }}-runtime'
          $dev = Join-Path $out 'windows-py${{ matrix.target }}-dev'
          python tools/resolve_windows_lock.py resolve --requirements requirements.txt --bundle $runtime
          if ($LASTEXITCODE -ne 0) { throw 'runtime resolution failed' }
          python tools/resolve_windows_lock.py resolve --requirements requirements-dev.txt --bundle $dev
          if ($LASTEXITCODE -ne 0) { throw 'development resolution failed' }
          python tools/resolve_windows_lock.py verify --requirements requirements.txt --bundle $runtime
          if ($LASTEXITCODE -ne 0) { throw 'runtime verification failed' }
          python tools/resolve_windows_lock.py verify --requirements requirements-dev.txt --bundle $dev
          if ($LASTEXITCODE -ne 0) { throw 'development verification failed' }
          $runtimeVenv = Join-Path $env:RUNNER_TEMP 'wavehelm-runtime-candidate'
          python -m venv --without-pip $runtimeVenv
          if ($LASTEXITCODE -ne 0) { throw 'runtime venv creation failed' }
          python -m pip --isolated --python $runtimeVenv install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r (Join-Path $runtime 'requirements.lock')
          if ($LASTEXITCODE -ne 0) { throw 'runtime installation failed' }
          python -m pip --isolated --python $runtimeVenv check
          if ($LASTEXITCODE -ne 0) { throw 'runtime pip check failed' }
          $devVenv = Join-Path $env:RUNNER_TEMP 'wavehelm-dev-candidate'
          python -m venv --without-pip $devVenv
          if ($LASTEXITCODE -ne 0) { throw 'development venv creation failed' }
          python -m pip --isolated --python $devVenv install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r (Join-Path $dev 'requirements.lock')
          if ($LASTEXITCODE -ne 0) { throw 'development installation failed' }
          python -m pip --isolated --python $devVenv check
          if ($LASTEXITCODE -ne 0) { throw 'development pip check failed' }

      - name: Upload candidate locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wavehelm-lock-candidates-py${{ matrix.target }}
          path: ${{ runner.temp }}/wavehelm-lock-candidates/
          if-no-files-found: error
          retention-days: 7
