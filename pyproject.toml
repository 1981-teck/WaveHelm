[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavehelm"
version = "1.0"
description = "Windows-targeted desktop media player with a wxPython UI, DSP audio, ambient playback, and a Media Foundation video pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Pastoris Marco Vincenzo", email = "mvsoundsystem81@gmail.com" },
]
keywords = ["wavehelm", "media-player", "wxpython", "windows", "media-foundation", "audio-dsp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://1981-teck.github.io/WaveHelm/"
Source = "https://github.com/1981-teck/WaveHelm"
Documentation = "https://1981-teck.github.io/WaveHelm/source-code-and-licenses.html"

[project.scripts]
wavehelm = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["src.ui", "src.ui.*"]

[tool.setuptools.package-data]
src = ["config/*.json", "locales/*.json", "resources/manual/*.html", "resources/manual/*.json", "resources/legal/*.md", "resources/legal/*.json", "resources/legal/licenses/*.txt"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
